services:
  - type: web
    name: bloi-agent
    env: node
    region: oregon
    plan: free
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: WS_PORT
        value: 8080
      - key: BASE_SEPOLIA_RPC_URL
        value: https://sepolia.base.org
      - key: INVOICE_NFT_ADDRESS
        value: 0x1045c1fFf861D9f6F6D00F30eCf6075832d998Ec
      - key: YIELD_VAULT_ADDRESS
        value: 0x271a64E069E683627C23712156EDC804ac6a2CD7
      - key: AGENT_ROUTER_ADDRESS
        value: 0xA8fDda52A8022610e94C49E54EF61D8ae9662BE0
      - key: PYTH_ORACLE_ADDRESS
        value: 0x69a23dC9Ba9e5C965beCeF191850E5Cea74954C3
      - key: AAVE_YIELD_ADDRESS
        value: 0xCE4E72C577031A96e4EAcA48028eE3d23C64eccE
      - key: AGENT_PRIVATE_KEY
        sync: false  # Will be set via Render dashboard (sensitive)
      - key: OPENAI_API_KEY
        sync: false  # Will be set via Render dashboard (sensitive)
